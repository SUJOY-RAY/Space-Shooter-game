<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: black;
            display: grid;
            place-items: center;
            overflow: hidden;
            overscroll-behavior: none;
            font-family: monospace;
            color: white;
        }
        body {
            position: fixed;
            inset: 0;
            width: 100%;
            /* Room for the fixed banner (top) and Quit button (bottom). */
            padding: 40px 8px 60px;
        }
        canvas {
            background: #0a0a19;
            border: 1px solid #333;
            cursor: pointer;
            /* Always fit inside the viewport (or iframe) at 4:3, never crop. */
            width: min(800px, 100%, calc((100vh - 120px) * 4 / 3));
            height: auto;
            display: block;
        }
        #quit-btn {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 10;
            background: rgba(16,17,43,0.9);
            color: #e8e8f5;
            border: 1px solid #ff3c3c;
            border-radius: 8px;
            padding: 8px 14px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        #quit-btn:hover { background: #ff3c3c; color: #0a0a19; }
        #quit-btn kbd {
            border: 1px solid currentColor;
            border-radius: 4px;
            padding: 0 5px;
            margin-left: 4px;
            font-family: inherit;
        }
    </style>
  <script type="module" crossorigin src="/assets/index-DFBdB-lR.js"></script>
</head>
<body>
    <div id="manager-banner" style="display:none;position:fixed;top:0;left:0;right:0;padding:6px 12px;background:#10112b;border-bottom:1px solid #00dcff;color:#e8e8f5;font-size:13px;text-align:center;z-index:10;"></div>
    <canvas id="game" width="800" height="600" title="Click to launch"></canvas>
    <button id="quit-btn" title="Quit the current run (Q)">✕ Quit<kbd>Q</kbd></button>
</body>
</html>
