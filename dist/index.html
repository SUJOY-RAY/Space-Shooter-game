<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Space Shooter</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #101014;
            overscroll-behavior: none;
            font-family: monospace;
            color: white;
        }
        body {
            position: fixed;
            inset: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* Handheld cabinet: screen on top, arcade pad in the space below. */
        #cabinet {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 10px;
            max-height: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
        #screen-bezel {
            background: #000;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 6px;
            line-height: 0;
        }
        canvas {
            background: #0a0a19;
            cursor: pointer;
            /* Fixed 800x600 arena, scaled to fill — never crop. */
            width: min(100%, calc((100vh - 16px) * 4 / 3), calc((100dvh - 16px) * 4 / 3));
            height: auto;
            max-width: 100%;
            display: block;
            touch-action: none;
            outline: none;
        }
        #screen-bezel {
            width: 100%;
            max-width: 560px;
            box-sizing: border-box;
        }
        /* Embedded in the Manager hub iframe: the iframe viewport is short,
           so never size the canvas from a fixed 300px pad offset — fill the
           bezel width and let the pad flow below (hub gives a tall frame). */
        body.embedded #screen-bezel { width: 100%; }
        body.embedded canvas { width: 100%; }
        /* Arcade pad: hidden on keyboard devices, shown on touch (see touch.ts). */
        #pad[hidden] { display: none !important; }
        #pad {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: min(100%, 560px);
            min-height: 196px;
            box-sizing: border-box;
            background: linear-gradient(180deg, #26262e, #17171c);
            border: 2px solid #333;
            border-radius: 18px;
            padding: 14px 18px;
            touch-action: none;
        }
        /* D-pad cross. */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 44px);
            grid-template-rows: repeat(3, 44px);
            gap: 0;
            flex: none;
        }
        .dpad button {
            background: #3a3a44;
            border: 1px solid #111;
            color: #cfcfd6;
            font-size: 16px;
            padding: 0;
            cursor: pointer;
            touch-action: none;
        }
        .dpad button:nth-child(2) { border-radius: 8px 8px 0 0; }
        .dpad button:nth-child(4) { border-radius: 8px 0 0 8px; }
        .dpad button:nth-child(6) { border-radius: 0 8px 8px 0; }
        .dpad button:nth-child(8) { border-radius: 0 0 8px 8px; }
        .dpad .nub {
            background: #2b2b33;
            border: 1px solid #111;
        }
        .dpad button.active { background: #00dcff; color: #001318; }
        /* Middle column: brand + system pills. */
        .pad-mid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex: 1 1 auto;
            min-width: 0;
        }
        .pad-brand {
            font-size: 11px;
            letter-spacing: 2px;
            color: #9a9ac0;
            text-align: center;
        }
        .pad-sysrow { display: flex; gap: 10px; }
        .pill {
            border: 2px solid #111;
            background: #3a3a44;
            color: #e8e8ee;
            border-radius: 999px;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 8px 14px;
            cursor: pointer;
            touch-action: none;
            min-width: 44px;
            min-height: 44px;
        }
        .pill.active { background: #9a9ac0; color: #101014; }
        /* A/B cannons. */
        .abtns {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: none;
        }
        .abtns button {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 3px solid #111;
            box-shadow: 0 4px 0 #000;
            font-family: inherit;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            touch-action: none;
            color: #1a0505;
        }
        #btn-b { background: radial-gradient(circle at 35% 30%, #ffe36e, #e0a800); align-self: flex-end; }
        #btn-a { background: radial-gradient(circle at 35% 30%, #ff7b7b, #c81e1e); align-self: flex-start; color: #fff; }
        .abtns button.active { transform: translateY(3px); box-shadow: 0 1px 0 #000; filter: brightness(1.25); }
        /* On touch screens the game view shrinks to leave room for the pad. */
        body.touch {
            align-items: flex-start;
            overflow-y: auto;
        }
        body.touch #cabinet { width: min(100%, 560px); }
        body.touch canvas {
            /* Clamped: in short viewports (e.g. hub iframe) the 300px pad
               offset goes negative — never collapse below a playable size. */
            width: min(100%, max(160px, calc((100vh - 300px) * 4 / 3)), max(160px, calc((100dvh - 300px) * 4 / 3)));
        }
        body.embedded.touch canvas { width: 100%; }
        /* Embedded in the hub: fill the frame height, canvas on top and the
           pad pinned to the bottom so no dead space sits under the controls. */
        body.embedded.touch { align-items: stretch; }
        body.embedded.touch #cabinet {
            width: min(100%, 560px);
            min-height: 100vh;
            min-height: 100dvh;
            justify-content: flex-start;
            margin: 0 auto;
        }
        body.embedded.touch #screen-bezel { flex: none; }
        body.embedded.touch #pad { margin-top: auto; margin-bottom: 4px; flex: none; width: 100%; }
        /* Narrow embedded frames: keep START/RST fully legible (no "RS"
           clipping) by tightening the middle column instead of squeezing it. */
        body.embedded .pad-mid { min-width: 0; }
        body.embedded .pad-sysrow { gap: 6px; }
        body.embedded .pill {
            padding: 6px 8px;
            min-width: 0;
            font-size: 9px;
            letter-spacing: 0.5px;
            white-space: nowrap;
            flex: none;
        }
        /* Narrow Android phones (~360px): the pad's d-pad + A/B row
           overflows without smaller cells, tighter gaps and padding. */
        @media (max-width: 420px) {
            #cabinet { gap: 8px; padding: 8px; width: 100%; }
            #screen-bezel { padding: 4px; border-radius: 8px; }
            #pad {
                gap: 6px;
                padding: 10px 12px;
                border-radius: 14px;
                min-height: 0;
            }
            .dpad {
                grid-template-columns: repeat(3, 38px);
                grid-template-rows: repeat(3, 38px);
            }
            .dpad button { font-size: 14px; }
            .abtns { gap: 8px; }
            .abtns button {
                width: 56px;
                height: 56px;
                font-size: 18px;
                border-width: 2px;
            }
            .pad-mid { gap: 8px; }
            .pad-brand { font-size: 10px; letter-spacing: 1px; }
            .pad-sysrow { gap: 6px; }
            .pill { padding: 6px 10px; min-width: 40px; min-height: 40px; }
        }
        @media (max-width: 340px) {
            .dpad {
                grid-template-columns: repeat(3, 34px);
                grid-template-rows: repeat(3, 34px);
            }
            .abtns button { width: 52px; height: 52px; font-size: 16px; }
            #pad { padding: 8px 10px; }
            .pad-brand { display: none; }
        }
        /* Short landscape phones: keep the whole cabinet scrollable and
           compact so canvas + pad never clip. */
        @media (max-height: 500px) {
            body.touch { align-items: flex-start; }
            #cabinet { gap: 6px; padding: 6px; }
            #pad { min-height: 0; padding: 8px 12px; }
            body.touch canvas {
                width: min(100%, calc((100vh - 220px) * 4 / 3), calc((100dvh - 220px) * 4 / 3));
            }
        }
    </style>
  <script type="module" crossorigin src="/assets/index-DZf9KD4K.js"></script>
</head>
<body>
    <div id="cabinet">
        <div id="screen-bezel">
            <canvas id="game" width="800" height="600" title="Tap to launch"></canvas>
        </div>
        <div id="pad" hidden>
            <div class="dpad" role="group" aria-label="Move">
                <span></span><button type="button" data-keys="arrowup" aria-label="Move up">▲</button><span></span>
                <button type="button" data-keys="arrowleft" aria-label="Move left">◀</button><span class="nub"></span><button type="button" data-keys="arrowright" aria-label="Move right">▶</button>
                <span></span><button type="button" data-keys="arrowdown" aria-label="Move down">▼</button><span></span>
            </div>
            <div class="pad-mid">
                <div class="pad-brand">SPACE&nbsp;SHOOTER</div>
                <div class="pad-sysrow">
                    <button type="button" class="pill" data-keys="enter" aria-label="Start">START</button>
                    <button type="button" class="pill" data-keys="r" aria-label="Restart">RST</button>
                </div>
            </div>
            <div class="abtns">
                <button type="button" id="btn-b" data-keys="z+c" aria-label="Wing guns">B</button>
                <button type="button" id="btn-a" data-keys="x" aria-label="Main cannon">A</button>
            </div>
        </div>
    </div>
</body>
</html>
