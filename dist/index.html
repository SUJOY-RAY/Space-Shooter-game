    <style>

            padding: 10px;

        .dpad {

            grid-template-rows: repeat(3, 44px);
            gap: 0;
            flex: none;

        .dpad button {

            border: 1px solid #111;
            color: #cfcfd6;
            font-size: 16px;
            padding: 0;
            cursor: pointer;
            touch-action: none;

        .dpad button:nth-child(2) { border-radius: 8px 8px 0 0; }
        .dpad button:nth-child(4) { border-radius: 8px 0 0 8px; }
        .dpad button:nth-child(6) { border-radius: 0 8px 8px 0; }
        .dpad button:nth-child(8) { border-radius: 0 0 8px 8px; }
        .dpad .nub {

            border: 1px solid #111;

        .dpad button.active { background: #00dcff; color: #001318; }

            flex: 1 1 auto;
            min-width: 0;
        }

            color: #9a9ac0;
            text-align: center;
        }
        .pad-sysrow { display: flex; gap: 10px; }
        /* System keyboard: the old START/RST pills live here as real

        .sys-label {
            font-size: 9px;
            letter-spacing: 2px;
            color: #6a6a78;
            text-align: center;
        }
        .syskeys { display: flex; gap: 6px; }
        button.key {
            border: 1px solid #111;
            border-bottom-width: 3px;
            background: linear-gradient(180deg, #4a4a55, #2c2c34);
            color: #e8e8ee;
            border-radius: 6px;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.5px;
            padding: 6px 10px;
            cursor: pointer;
            touch-action: none;
            min-width: 40px;
            min-height: 36px;
        }
        button.key kbd {
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
        }
        button.key.active {
            background: #9a9ac0; color: #101014;
            border-bottom-width: 1px;
            transform: translateY(2px);
        }
        /* Enter looks like a small one-line text box (still a button —
           tap it to start). */
        button.key-textbox {
            flex: 1 1 auto;
            background: rgba(255, 255, 255, 0.92);
            color: #6d6d70;
            text-align: left;
            font-weight: normal;
            font-size: 9px;
            padding: 4px 8px;
            min-width: 0;
            min-height: 28px;
            border: 1px solid #111;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25);
            border-radius: 6px;
            white-space: nowrap;
        }
        button.key-textbox.active {
            background: #ffffff; color: #111111;
            transform: none;
            border-bottom-width: 1px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25);
        }
        /* Fire joystick: ball-top stick over a dark dished base. Grab it,
           drag toward a direction to fire that way, release to spring back
           and stop. Diagonals land properly — the shot follows the stick. */
        #fire-ring {
            position: relative;
            width: 148px; height: 148px;
            flex: none;
            border-radius: 50%;
            border: 2px solid #0c0c0f;
            box-shadow: 0 4px 0 #000,

            --jy: 0px;
            --aim: 0deg;
            --mag: 0px;
        }
        #fire-ring.active { filter: brightness(1.15); cursor: grabbing; }
        #fire-ring .tick {
            position: absolute; left: 50%; top: 50%;
            width: 18px; height: 18px; margin: -9px 0 0 -9px;
            display: grid; place-items: center;
            font-size: 13px; color: #c9c9d2;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            transform: rotate(var(--a)) translateY(var(--tick-r)) rotate(calc(-1 * var(--a)));
        }
        /* Stick stem: stretches from the dish center toward the ball. */
        #fire-ring .joy-stem {
            position: absolute; left: 50%; top: 50%;
            width: var(--mag); height: 16px; margin-top: -8px;
            transform-origin: left center;
            transform: rotate(var(--aim));
            background: linear-gradient(180deg, #3c3c44, #141418);
            border-radius: 8px;
            pointer-events: none;
        }
        /* Ball top: light gray sphere, shadow falls opposite the drag. */
        #fire-ring .joy-stick {
            position: absolute; left: 50%; top: 50%;
            width: 56px; height: 56px; margin: -28px 0 0 -28px;
            border-radius: 50%;
            background: radial-gradient(circle at 34% 28%,

            border: 2px solid #0c0c0f;
            box-shadow: calc(var(--jx) * -0.25) calc(var(--jy) * -0.25 + 5px) 12px rgba(0, 0, 0, 0.55),
                inset -3px -5px 8px rgba(0, 0, 0, 0.25);
            pointer-events: none;
            transform: translate(var(--jx), var(--jy));
        }
        /* On touch screens the game view shrinks to leave room for the pad. */
        body.touch {
            align-items: flex-start;
            overflow-y: auto;
        }
        body.touch #cabinet { width: min(100%, 560px); }
        body.touch canvas {
            /* Clamped: in short viewports (e.g. hub iframe) the 300px pad

            width: min(100%, max(160px, calc((100vh - 300px) * 4 / 3)), max(160px, calc((100dvh - 300px) * 4 / 3)));
        }
        body.embedded.touch canvas { width: 100%; }
        /* Embedded in the hub: fill the frame height, canvas on top and the

        body.embedded.touch { align-items: stretch; }
        body.embedded.touch #cabinet {
            width: min(100%, 560px);
            min-height: 100vh;
            min-height: 100dvh;
            justify-content: flex-start;
            margin: 0 auto;
            /* Squeeze every pixel into the game screen on phones. */
            padding: 6px;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
            gap: 6px;
        }
        body.embedded.touch #screen-bezel { flex: none; }
        body.embedded #screen-bezel { padding: 2px; }
        body.embedded.touch #pad { margin-top: auto; margin-bottom: 110px; flex: none; width: 100%; min-height: 0; }
        /* Narrow embedded frames: keep the system keys fully legible by
           tightening the middle column instead of squeezing it. */
        body.embedded .pad-mid { min-width: 0; }
        body.embedded .pad-sysrow { gap: 6px; }
        body.embedded button.key {
            padding: 6px 8px;
            min-width: 0;
            font-size: 9px;
            white-space: nowrap;
            flex: none;
        }
        body.embedded button.key-textbox {
            padding: 4px 8px;
            min-height: 28px;
            font-size: 9px;
            flex: 1 1 auto;
        }
        /* Phones: drop the decorative brand + caption from the pad —
           only the controls stay. */
        @media (max-width: 600px) {
            .pad-brand, .sys-label { display: none; }
        }
        /* Narrow Android phones (~360px): the pad's d-pad + A/B row

        @media (max-width: 420px) {
            #cabinet { gap: 8px; padding: 8px; width: 100%; }
            #screen-bezel { padding: 4px; border-radius: 8px; }
            #pad {
                gap: 6px;
                padding: 10px 12px;
                border-radius: 14px;
                min-height: 0;
            }
            .dpad {
                grid-template-columns: repeat(3, 38px);
                grid-template-rows: repeat(3, 38px);
            }
            .dpad button { font-size: 14px; }
            #fire-ring { width: 136px; height: 136px; --tick-r: -54px; }
            #fire-ring .tick { font-size: 12px; }
            #fire-ring .joy-stick { width: 52px; height: 52px; margin: -26px 0 0 -26px; }
            .pad-mid { gap: 8px; }
            .pad-brand { font-size: 10px; letter-spacing: 1px; }
            .pad-sysrow { gap: 6px; }
            button.key { padding: 6px 8px; min-width: 36px; min-height: 36px; }
            button.key-textbox { padding: 4px 8px; min-width: 0; min-height: 28px; font-size: 9px; }
        }
        @media (max-width: 340px) {
            .dpad {
                grid-template-columns: repeat(3, 34px);
                grid-template-rows: repeat(3, 34px);
            }
            #fire-ring { width: 124px; height: 124px; --tick-r: -48px; }
            #fire-ring .tick { font-size: 11px; }

            #pad { padding: 8px 10px; }
            .pad-brand { display: none; }

        @media (max-height: 500px) {
            body.touch { align-items: flex-start; }
            #cabinet { gap: 6px; padding: 6px; }
            #pad { min-height: 0; padding: 8px 12px; }
            body.touch canvas {
                width: min(100%, calc((100vh - 220px) * 4 / 3), calc((100dvh - 220px) * 4 / 3));
            }
        }
    </style>

<body>
    <div id="cabinet">
        <div id="screen-bezel">
            <canvas id="game" width="800" height="600" title="Tap to launch"></canvas>
        </div>
        <div id="pad" hidden>
            <div class="dpad" role="group" aria-label="Move">
                <span></span><button type="button" data-keys="arrowup" aria-label="Move up">▲</button><span></span>
                <button type="button" data-keys="arrowleft" aria-label="Move left">◀</button><span class="nub"></span><button type="button" data-keys="arrowright" aria-label="Move right">▶</button>
                <span></span><button type="button" data-keys="arrowdown" aria-label="Move down">▼</button><span></span>
            </div>
            <div class="pad-mid">
                <div class="pad-brand">SPACE&nbsp;SHOOTER</div>
                <div class="sys-label">SYSTEM</div>
                <div class="syskeys">
                    <button type="button" class="key key-textbox" data-keys="enter" aria-label="Start (Enter key)"><span>Enter ⏎</span></button>
                </div>
            </div>
            <div id="fire-ring" role="button" tabindex="0" aria-label="Fire joystick — drag toward a direction to fire that way, release to stop">
                <span class="tick" style="--a:-90deg">▲</span>
                <span class="tick" style="--a:0deg">▶</span>
                <span class="tick" style="--a:90deg">▼</span>
                <span class="tick" style="--a:180deg">◀</span>
                <span class="joy-stem" aria-hidden="true"></span>
                <span class="joy-stick" aria-hidden="true"></span>
            </div>
        </div>
    </div>
