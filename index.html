<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: black;
            display: grid;
            place-items: center;
            overflow: hidden;
            overscroll-behavior: none;
            font-family: monospace;
            color: white;
        }
        body {
            position: fixed;
            inset: 0;
            width: 100%;
        }
        canvas {
            background: #0a0a19;
            border: 1px solid #333;
            cursor: pointer;
            /* Fixed 800x600 arena, scaled to fill — never crop. */
            width: min(100%, calc((100vh - 16px) * 4 / 3));
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="game" width="800" height="600" title="Click to launch"></canvas>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
